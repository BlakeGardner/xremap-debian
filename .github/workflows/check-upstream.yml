name: Check upstream for new releases

on:
  schedule:
    - cron: "23 6 * * *" # daily at 06:23 UTC
  workflow_dispatch:

concurrency:
  group: check-upstream
  cancel-in-progress: false

jobs:
  check-upstream:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          # Use the PAT so pushes and releases made here trigger other workflows.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Update VERSION if upstream published a newer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          upstream=$(gh api repos/xremap/xremap/releases/latest --jq '.tag_name')
          upstream="${upstream#v}"
          current=$(cat VERSION)
          echo "Upstream version: $upstream — packaged version: $current"

          newest=$(printf '%s\n%s\n' "$current" "$upstream" | sort -V | tail -n1)
          if [ "$upstream" = "$current" ]; then
            echo "Packaged version is up to date."
          elif [ "$newest" = "$upstream" ]; then
            echo "$upstream" > VERSION
            echo "1" > DEB_REVISION
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add VERSION DEB_REVISION
            git commit -m "Update xremap to upstream version $upstream"
            git push
          else
            echo "::error::Packaged version $current is ahead of upstream $upstream. VERSION is likely wrong (e.g. set from a bogus upstream tag) — fix it manually."
            exit 1
          fi

      - name: Publish a release for the packaged version if missing
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          version=$(cat VERSION)
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release v$version already exists — nothing to do."
          else
            gh release create "v$version" \
              --repo "$GITHUB_REPOSITORY" \
              --title "xremap $version" \
              --notes "Debian/Ubuntu packages for xremap upstream version $version."
          fi
